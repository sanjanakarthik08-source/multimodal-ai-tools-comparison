{% extends "base.html" %}{% block title %}Prompt Library | CAPSTONE 57{% endblock %}{% block content %}<section><small>REUSABLE PROMPTS</small><h2>Prompt library</h2><p>Use the same prompt for each tool and save the exact prompt used.</p></section>{% for title,prompt in prompts %}<section><h3>{{title}}</h3><p>{{prompt}}</p><button class="btn" onclick="navigator.clipboard.writeText({{prompt|tojson}}).then(()=>this.textContent='Copied!')">Copy prompt</button></section>{% endfor %}{% endblock %}
